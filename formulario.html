<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <h1>Formulario</h1>

        <p>
            apresentação do formulario
        </p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>

        <a href="audio.html">Audio</a>

        <a href="video.html">Video</a>

    </nav>

    <main>
       
        <section>

            <h2>
                Formulario de contato
            </h2>

            <p>Preencha o formulario abaixo para entrar em contato conosco.</p>
             
            <form action="#" method="post">

                <label for="nome">Nome:</label>

                <input type="text" id="nome" name="nome" required>

                <label for="email">Email:</label>

                <input type="email" id="email" name="email" required>

                <label for="nascimento">Data de Nascimento:</label>

                <input type="date" id="nascimento" name="nascimento" required>

                <label for="personagem">Personagem Favorito:</label>

                <select id="personagem" name="personagem" required>
                    <option value="sam">Sam Winchester</option>
                    <option value="dean">Dean Winchester</option>
                    <option value="castiel">Castiel</option>
                    <option value="John">John Winchester</option>

                </select>

                <fieldset>
                    
                    <legend>Recomendaria a serie</legend>

                    <label class="opcao">

                        <input type="radio" name="recomendaria" value="sim" required> sim

                    </label>

                    <label class="opcao">

                         <input type="radio" name="recomendaria" value="nao" required> não

                    </label>      

                </fieldset>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>
    
</body>
</html>
